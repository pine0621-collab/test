name: announcement
platform: linkedin
description: 서비스 런칭, 이벤트, 채용 등 공지 포스트
category: announcement

structure:
  headline: |
    명확하고 간결한 핵심 메시지
    예: "바리온랩스, AI 해커톤 서비스 정식 런칭"

  details: |
    - 무엇인가 (What)
    - 언제인가 (When)
    - 어디서 (Where)
    - 왜 중요한가 (Why)

  benefits: |
    대상에게 주는 혜택/가치

  cta: |
    명확한 다음 행동 안내
    예: "지금 신청하세요", "자세한 내용 확인"

variables:
  - name: announcement_type
    description: 공지 유형 (런칭/이벤트/채용/파트너십)
    required: true
  - name: title
    description: 공지 제목
    required: true
  - name: description
    description: 상세 내용
    required: true
  - name: date
    description: 관련 날짜
    required: false
  - name: link
    description: 관련 링크
    required: false
  - name: target_audience
    description: 대상 독자
    required: true

prompt_template: |
  당신은 바리온랩스의 PR 담당자입니다. LinkedIn에 게시할 공지 포스트를 작성하세요.

  **공지 유형**: {announcement_type}
  **제목**: {title}
  **상세 내용**: {description}
  **날짜**: {date}
  **링크**: {link}
  **대상**: {target_audience}

  **작성 가이드라인**:
  1. 핵심 메시지를 첫 줄에 명확히
  2. 필요한 정보를 구조적으로 정리
  3. 대상에게 주는 가치 강조
  4. 명확한 CTA (Call to Action)
  5. 적절한 이모지로 시각적 구분
  6. 총 길이: 800자 이내

  **포함할 해시태그**:
  #바리온랩스 #AI #공지

example_output: |
  🚀 바리온랩스, AI 해커톤 서비스 정식 런칭

  기업의 AI 전환, 해커톤으로 시작하세요!

  ━━━━━━━━━━━━━━━━

  📌 서비스 소개
  • 임직원 대상 AI 해커톤 기획 및 운영
  • 비개발자도 참여 가능한 노코드/로우코드 환경
  • miri.dev 플랫폼 기반 즉시 배포

  🎯 이런 기업에 적합합니다
  • AI 도입을 검토 중인 기업
  • 임직원 AI 역량 강화가 필요한 기업
  • 새로운 서비스 아이디어가 필요한 기업

  💡 기대 효과
  • 2일 만에 실제 작동하는 AI 프로토타입
  • 임직원의 AI 활용 역량 향상
  • 조직 내 AI 문화 확산

  ━━━━━━━━━━━━━━━━

  📩 문의: ceo@baryon.ai
  🔗 자세히 보기: https://labs.baryon.ai/

  #AI해커톤 #바리온랩스 #AI전환 #기업교육 #이노베이션
