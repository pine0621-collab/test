name: carousel
platform: instagram
description: 교육적 콘텐츠나 팁을 슬라이드 형식으로 전달하는 캐러셀 포스트
category: educational

structure:
  cover_slide: |
    주목을 끄는 제목 (5단어 이내)
    서브타이틀 또는 카테고리 표시

  content_slides: |
    - 슬라이드당 하나의 핵심 포인트
    - 짧고 간결한 텍스트 (30자 이내)
    - 시각적 계층 구조 유지
    - 보통 5-10장 구성

  summary_slide: |
    핵심 요약 또는 체크리스트

  cta_slide: |
    행동 유도 (저장, 공유, 팔로우)
    연락처 또는 프로필 안내

variables:
  - name: topic
    description: 캐러셀 주제
    required: true
  - name: points
    description: 슬라이드별 포인트 (5-10개)
    required: true
  - name: target_audience
    description: 타겟 독자
    required: true
  - name: cta
    description: 원하는 행동
    required: true

prompt_template: |
  당신은 바리온랩스의 소셜 미디어 담당자입니다. Instagram 캐러셀 포스트의 텍스트를 작성하세요.

  **주제**: {topic}
  **포인트들**: {points}
  **타겟**: {target_audience}
  **CTA**: {cta}

  **작성 가이드라인**:
  1. 커버 슬라이드: 호기심을 자극하는 제목
  2. 콘텐츠 슬라이드: 슬라이드당 1포인트, 30자 이내
  3. 캡션: 400자 이내, 친근한 톤
  4. 해시태그: 관련성 높은 10-15개
  5. 이모지 적극 활용

  **출력 형식**:
  - [슬라이드 1] 커버 텍스트
  - [슬라이드 2-N] 각 포인트
  - [마지막] CTA 슬라이드
  - [캡션] 설명 텍스트 + 해시태그

example_output: |
  [슬라이드 1 - 커버]
  AI 프롬프트 작성법
  5가지 핵심 원칙

  [슬라이드 2]
  1. 구체적으로 요청하기
  "좋은 글 써줘" ❌
  "500자 블로그 포스트 써줘" ✅

  [슬라이드 3]
  2. 맥락 제공하기
  배경 정보를 주면
  더 정확한 답변을 받아요

  [슬라이드 4]
  3. 예시 보여주기
  원하는 결과물의 예시를
  함께 제시하세요

  [슬라이드 5]
  4. 역할 부여하기
  "당신은 마케팅 전문가입니다"
  전문적인 관점 획득

  [슬라이드 6]
  5. 단계별로 요청하기
  복잡한 작업은
  나눠서 진행하세요

  [슬라이드 7 - 요약]
  ✅ 구체적으로
  ✅ 맥락 제공
  ✅ 예시 포함
  ✅ 역할 부여
  ✅ 단계별로

  [슬라이드 8 - CTA]
  저장하고 나중에 써먹기 📌
  @baryonlabs 팔로우하고
  더 많은 AI 팁 받기!

  [캡션]
  AI를 잘 쓰려면 '질문'을 잘 해야 해요 🤖✨

  프롬프트 작성, 어렵게 느껴지시나요?
  이 5가지만 기억하면 AI 활용 효율이 확 올라갑니다!

  저장해두고 필요할 때 꺼내보세요 📌

  AI 활용 팁이 더 궁금하다면
  바리온랩스 프로필 링크를 확인하세요!

  ─────────────────

  #AI #프롬프트 #ChatGPT #Claude #AI활용법
  #생성형AI #프롬프트엔지니어링 #AI팁 #업무효율
  #바리온랩스 #AI교육 #디지털전환 #스마트워크
