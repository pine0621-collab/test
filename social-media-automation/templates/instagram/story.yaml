name: story
platform: instagram
description: 일상 공유, 빠른 공지, 참여 유도를 위한 스토리 콘텐츠
category: behind_the_scenes

structure:
  single_story: |
    15초 이내 단일 콘텐츠
    - 이미지 또는 짧은 영상
    - 텍스트 오버레이
    - 스티커/투표/질문 기능 활용

  story_series: |
    연속된 스토리 (3-7개)
    - 스토리텔링 또는 튜토리얼
    - 스와이프 유도
    - 마지막에 CTA

variables:
  - name: story_type
    description: 스토리 유형 (일상/공지/질문/투표/튜토리얼)
    required: true
  - name: content
    description: 전달할 내용
    required: true
  - name: interactive_element
    description: 사용할 인터랙티브 요소
    required: false
  - name: link
    description: 스와이프업 링크 (있다면)
    required: false

prompt_template: |
  당신은 바리온랩스의 소셜 미디어 담당자입니다. Instagram 스토리 시리즈를 기획하세요.

  **스토리 유형**: {story_type}
  **내용**: {content}
  **인터랙티브 요소**: {interactive_element}
  **링크**: {link}

  **작성 가이드라인**:
  1. 각 스토리는 15초 이내로 소화 가능하게
  2. 첫 스토리로 관심 유도
  3. 스티커, 투표, 질문 등 참여 요소 포함
  4. 마지막에 명확한 행동 유도
  5. 텍스트는 짧고 굵게 (10단어 이내)

  **출력 형식**:
  - [스토리 1] 비주얼 설명 + 텍스트
  - [스토리 2-N] 각 스토리 내용
  - [인터랙티브] 사용할 기능 설명

example_output: |
  [스토리 시리즈: AI 활용 투표]

  ─────────────────

  [스토리 1]
  비주얼: 팀 미팅 사진 또는 노트북 화면
  텍스트: "오늘 고민 🤔"
  서브텍스트: "AI로 뭘 자동화하면 좋을까요?"

  [스토리 2 - 투표]
  비주얼: 단색 배경 + 투표 스티커
  텍스트: "가장 자동화하고 싶은 업무?"

  투표 옵션:
  □ 이메일 작성
  □ 보고서 작성
  □ 일정 관리
  □ 데이터 정리

  [스토리 3]
  비주얼: 투표 결과 캡처 (나중에 추가)
  텍스트: "결과 발표! 🎉"
  서브텍스트: "1위는 바로..."

  [스토리 4 - CTA]
  비주얼: 바리온랩스 로고 또는 서비스 이미지
  텍스트: "자동화 고민 상담 원하시면?"
  스와이프업: labs.baryon.ai
  또는
  텍스트: "DM 주세요! 📩"

  ─────────────────

  [활용 스티커]
  - 투표 스티커: 참여 유도
  - 질문 스티커: "AI로 해결하고 싶은 업무가 있나요?"
  - 카운트다운: 이벤트/웨비나 알림용
  - 링크 스티커: 웹사이트 연결
