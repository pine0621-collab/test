name: reels
platform: instagram
description: 짧은 영상 콘텐츠를 위한 스크립트 및 캡션
category: educational

structure:
  hook: |
    0-3초: 시선을 사로잡는 오프닝
    "이거 모르면 AI 못 씁니다"
    "AI로 10분 만에 이걸 만들었어요"

  content: |
    3-45초: 핵심 내용 전달
    - 빠른 템포로 정보 전달
    - 화면 전환과 텍스트 오버레이 활용
    - 비포/애프터 또는 단계별 시연

  cta: |
    45-60초: 행동 유도
    "댓글로 질문 남겨주세요"
    "팔로우하고 더 많은 팁 받기"

variables:
  - name: topic
    description: 릴스 주제
    required: true
  - name: key_message
    description: 전달할 핵심 메시지
    required: true
  - name: demonstration
    description: 시연할 내용 (있다면)
    required: false
  - name: duration
    description: 영상 길이 (15/30/60초)
    required: true

prompt_template: |
  당신은 바리온랩스의 콘텐츠 크리에이터입니다. Instagram Reels 스크립트와 캡션을 작성하세요.

  **주제**: {topic}
  **핵심 메시지**: {key_message}
  **시연 내용**: {demonstration}
  **영상 길이**: {duration}

  **작성 가이드라인**:
  1. 후크: 3초 내 관심 끌기
  2. 대본: 구어체, 빠른 템포
  3. 텍스트 오버레이 지시사항 포함
  4. 캡션: 200자 이내
  5. 해시태그: 15-20개

  **출력 형식**:
  - [스크립트] 타임스탬프별 대본
  - [텍스트 오버레이] 화면에 표시할 텍스트
  - [캡션] 설명 + 해시태그

example_output: |
  [스크립트]

  0:00-0:03 [후크]
  "ChatGPT로 이메일 쓰는데 30분 걸린다고요?"
  (텍스트: "이메일 30분? 😱")

  0:03-0:08 [문제 제시]
  "매번 처음부터 다시 쓰고 있잖아요"
  (텍스트: "매번 처음부터...")

  0:08-0:20 [해결책]
  "이렇게 해보세요. 먼저 역할을 정해줍니다."
  "당신은 B2B 영업 전문가입니다"
  (텍스트: "1. 역할 부여")

  "그다음 템플릿을 만들어달라고 하세요"
  (텍스트: "2. 템플릿 요청")

  "이제 상황만 바꿔 넣으면 끝!"
  (텍스트: "3. 상황만 입력")

  0:20-0:25 [결과]
  "30분이 3분으로!"
  (텍스트: "30분 → 3분 ⚡")

  0:25-0:30 [CTA]
  "이런 팁 더 원하면 팔로우!"
  (텍스트: "@baryonlabs 팔로우 🔔")

  ─────────────────

  [캡션]
  이메일 하나에 30분? 이제 3분이면 돼요! ⚡

  AI 템플릿 활용법, 저장해두세요 📌

  더 많은 업무 효율화 팁이 궁금하다면
  바리온랩스와 함께하세요!

  #AI #ChatGPT #업무효율 #이메일작성 #생산성
  #AI활용 #프롬프트 #스마트워크 #직장인팁
  #바리온랩스 #AI교육 #자동화 #업무자동화
  #시간관리 #효율화 #릴스 #인스타릴스
